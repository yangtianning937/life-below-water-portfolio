<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeBelowWater | Redirecting</title>
    <script>
      (function () {
        var repoBase = "/life-below-water-portfolio";
        var path = window.location.pathname;
        var route = path.indexOf(repoBase) === 0 ? path.slice(repoBase.length) : path;

        if (!route || route === "/") {
          route = "/";
        }

        window.location.replace(
          repoBase + "/#" + route + window.location.search + window.location.hash
        );
      })();
    </script>
  </head>
  <body>
    Redirecting to LifeBelowWater...
  </body>
</html>
